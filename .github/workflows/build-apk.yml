
name: Build Yuskol APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            python3-pip python3-venv build-essential \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m venv $HOME/buildozer-venv
          $HOME/buildozer-venv/bin/pip install --upgrade pip setuptools
          $HOME/buildozer-venv/bin/pip install buildozer cython==0.29.36
          echo "$HOME/buildozer-venv/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yuskol-Android-APK
          path: bin/*.apk
